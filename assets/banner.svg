<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Vibrant Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtitle Glow Gradient -->
    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: url(#sub-grad);
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #ffffff;
    }
    
    /* Subtle Dynamic Animations in Background (safely positioned behind text) */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(15px) rotate(-5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse-ring {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.6; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }

    .bg-shape-1 { animation: float1 8s ease-in-out infinite; transform-origin: center; }
    .bg-shape-2 { animation: float2 10s ease-in-out infinite; transform-origin: center; }
    .pulse-layer { animation: pulse-ring 6s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Base Card Area -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-grad)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept strictly behind and around borders) -->
  <g class="pulse-layer" opacity="0.4">
    <circle cx="150" cy="80" r="180" fill="#6366f1" filter="blur(60px)"/>
    <circle cx="1050" cy="270" r="200" fill="#a855f7" filter="blur(70px)"/>
    <circle cx="600" cy="320" r="140" fill="#06b6d4" filter="blur(60px)"/>
  </g>

  <!-- Background Decorative Code/Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
  </g>

  <!-- Dynamic Floating Decorative Tech Orbs (Side Areas) -->
  <g class="bg-shape-1">
    <rect x="60" y="50" width="80" height="80" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M90 80 L110 80 M100 70 L100 90" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g class="bg-shape-2">
    <rect x="1060" y="60" width="80" height="80" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="1100" cy="100" r="12" stroke="#c084fc" stroke-width="2" fill="none"/>
  </g>

  <!-- FOREGROUND CONTENT: Clean, Unobstructed Center -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <rect x="440" y="45" width="320" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
    <text x="600" y="66" class="badge-text" text-anchor="middle">⚡ Curated Low-Code Ecosystem 2026</text>

    <!-- Main Title -->
    <text x="600" y="145" class="title" filter="url(#glow)">Awesome Low-Code Web Development</text>
    
    <!-- Subtitle -->
    <text x="600" y="195" class="subtitle">SaaS Platforms • Open-Source Builders • Headless CMS • Drag &amp; Drop Tools</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 240)">
      <!-- Tag 1 -->
      <rect x="330" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="410" y="23" class="badge-text" text-anchor="middle">🚀 Visual Builders</text>

      <!-- Tag 2 -->
      <rect x="520" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
      <text x="600" y="23" class="badge-text" text-anchor="middle">⭐ Open-Source</text>

      <!-- Tag 3 -->
      <rect x="710" y="0" width="160" height="36" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6"/>
      <text x="790" y="23" class="badge-text" text-anchor="middle">💎 SaaS Solutions</text>
    </g>
  </g>
</svg>
