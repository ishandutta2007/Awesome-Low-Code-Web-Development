<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="sub-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes float1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-15px) rotate(5deg)}}@keyframes float2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(15px) rotate(-5deg)}}@keyframes pulse-ring{0%{opacity:.3;transform:scale(.98)}50%{opacity:.6;transform:scale(1.02)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:48px;fill:url(#text-grad)}.subtitle{font-weight:500;font-size:20px;fill:url(#sub-grad)}.badge-text{font-weight:600;font-size:14px;fill:#fff}.bg-shape-1{animation:float1 8s ease-in-out infinite;transform-origin:center}.bg-shape-2,.pulse-layer{animation:float2 10s ease-in-out infinite;transform-origin:center}.pulse-layer{animation:pulse-ring 6s ease-in-out infinite}</style><rect width="1200" height="350" fill="url(#bg-grad)" rx="16"/><g class="pulse-layer" opacity=".4"><circle cx="150" cy="80" r="180" fill="#6366f1" filter="blur(60px)"/><circle cx="1050" cy="270" r="200" fill="#a855f7" filter="blur(70px)"/><circle cx="600" cy="320" r="140" fill="#06b6d4" filter="blur(60px)"/></g><g stroke="#fff" stroke-opacity=".05" stroke-width="1"><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/></g><g class="bg-shape-1"><rect width="80" height="80" x="60" y="50" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.5" rx="16"/><path stroke="#38bdf8" stroke-linecap="round" stroke-width="2" d="M90 80 L110 80 M100 70 L100 90"/></g><g class="bg-shape-2"><rect width="80" height="80" x="1060" y="60" fill="#1e293b" stroke="#c084fc" stroke-opacity=".4" stroke-width="1.5" rx="16"/><circle cx="1100" cy="100" r="12" fill="none" stroke="#c084fc" stroke-width="2"/></g><g text-anchor="middle"><rect width="320" height="32" x="440" y="45" fill="#1e293b" stroke="#6366f1" stroke-width="1" rx="16"/><text x="600" y="66" class="badge-text" text-anchor="middle">⚡ Curated Low-Code Ecosystem 2026</text><text x="600" y="145" class="title" filter="url(#glow)">Awesome Low-Code Web Development</text><text x="600" y="195" class="subtitle">SaaS Platforms • Open-Source Builders • Headless CMS • Drag &amp; Drop Tools</text><g transform="translate(0, 240)"><rect width="160" height="36" x="330" y="0" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1" rx="8"/><text x="410" y="23" class="badge-text" text-anchor="middle">🚀 Visual Builders</text><rect width="160" height="36" x="520" y="0" fill="#0f172a" stroke="#818cf8" stroke-opacity=".6" stroke-width="1" rx="8"/><text x="600" y="23" class="badge-text" text-anchor="middle">⭐ Open-Source</text><rect width="160" height="36" x="710" y="0" fill="#0f172a" stroke="#c084fc" stroke-opacity=".6" stroke-width="1" rx="8"/><text x="790" y="23" class="badge-text" text-anchor="middle">💎 SaaS Solutions</text></g></g></svg>